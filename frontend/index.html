<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KDeenOff</title>
  <meta name="description"
    content="Play with code KDEENOFF — join stream raffles, climb the leaderboard and claim exclusive bonuses.">
  <meta name="theme-color" content="#0c1218">
  <script>
    (function () {
      var theme = "dark";
      try {
        var stored = localStorage.getItem("kdeenoff-theme-v2");
        if (stored === "dark" || stored === "light") theme = stored;
      } catch (e) {  }
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0c1218" : "#f7f7f7");
    })();
  </script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preload" href="/fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/img/brand/mark-muzzle.png" as="image" type="image/png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/main.css?v=160">
  <link rel="stylesheet" href="/css/raffles-live.css?v=9">
</head>

<body class="site">
  <script>
    (function () {
      /* Page class before first paint, so the home ground and page layouts do not flash. */
      var path = location.pathname;
      var page = "";
      if (path === "/" || path === "/index.html") page = "site--home";
      else if (/^\/raffles\/?$/.test(path)) page = "site--raffles";
      else if (/^\/raffles\/\d+\/?$/.test(path)) page = "site--raffle-detail";
      else if (/^\/cases\/?$/.test(path)) page = "site--raffles site--cases";
      else if (/^\/bonuses\/?$/.test(path)) page = "site--bonuses";
      else if (/^\/account\/?$/.test(path)) page = "site--account";
      else if (/^\/leaderboards(?:\/(?:[a-z0-9][a-z0-9-]{0,38}[a-z0-9]\/?)?)?$/.test(path)) page = "site--board";
      if (page) document.body.className += " " + page;

      try {
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.body.classList.add("site-booting");
        }
      } catch (e)   {}

      var open = true;
      try {
        var stored = localStorage.getItem("kdeenoff-chat");
        if (stored === "0" || stored === "1") open = stored === "1";
        else open = matchMedia("(min-width: 1041px)").matches;
      } catch (e )  {}
      document.body.classList.toggle("chat-open", open);
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/public/main.tsx"></script>
</body>

</html>
