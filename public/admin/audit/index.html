<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Log · Admin KDeenOff</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body" data-admin-page="audit">
  <header class="admin-header">
    <div class="admin-header__inner">
      <a href="/admin/" class="admin-header__brand">
        <strong>KDeenOff</strong>
        <span class="admin-header__badge">Admin</span>
      </a>

      <nav class="admin-nav">
        <a href="/admin/">Overview</a>
        <a href="/admin/leaderboards/">Leaderboards</a>
        <a href="/admin/raffles/">Raffles</a>
        <a href="/admin/site/">Site settings</a>
        <a href="/admin/audit/" class="is-active">Audit log</a>
      </nav>

      <a href="/" class="admin-header__site-link" target="_blank">Open site ↗</a>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-page-head">
      <div>
        <h1 class="admin-page-title">Audit Log</h1>
        <p class="admin-page-sub">History of all changes to settings, players, ranks and payouts</p>
      </div>

      <div class="admin-page-actions">
        <button type="button" class="adm-btn adm-btn--secondary" data-btn-refresh-audit>
          ↻ Refresh log
        </button>
      </div>
    </div>

    <div class="admin-card">
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date & time</th>
              <th>User</th>
              <th>Action</th>
              <th>Target</th>
              <th>Details (JSON)</th>
            </tr>
          </thead>
          <tbody data-admin-audit-tbody>
            <tr>
              <td colspan="5" class="admin-status">Loading log…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
